services:
  - type: worker
    name: mad-day-telegram-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
  - type: worker
    name: mad-day-vk-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python vk_bot.py
    autoDeploy: true
  - type: web
    name: mad-day-web-form
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 web_form.py
    autoDeploy: true
